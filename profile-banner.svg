<g fill="none" stroke="#8cd6b2"><circle class="orbit" cx="1045" cy="215" r="130" stroke-opacity=".2" stroke-dasharray="3 15"/><path d="M1045 116V185M929 254L1011 223M1161 254L1079 223" stroke-opacity=".25"/><path class="packet" d="M1045 116V185M929 254L1011 223M1161 254L1079 223" stroke="#e8b63a" stroke-width="2"/></g>
