<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-label="Muhammad Shuhaife P. Senior Software Engineer. Building the systems behind big ideas.">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101712"/><stop offset=".6" stop-color="#142e24"/><stop offset="1" stop-color="#265c43"/></linearGradient><radialGradient id="light"><stop stop-color="#8cd6b2" stop-opacity=".18"/><stop offset="1" stop-color="#8cd6b2" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#b1c1b6" stroke-opacity=".05"/></pattern></defs>
<style>
.packet{stroke-dasharray:8 90;animation:flow 7s linear infinite}.orbit{transform-origin:1045px 215px;animation:orbit 40s linear infinite}.breath{animation:breathe 5s ease-in-out infinite}.cursor{animation:blink 2s steps(2,end) infinite}
@keyframes flow{to{stroke-dashoffset:-196}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes breathe{50%{opacity:.45}}@keyframes blink{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.packet,.orbit,.breath,.cursor{animation:none}}
</style>
<rect width="1280" height="460" rx="24" fill="url(#bg)"/><rect width="1280" height="460" rx="24" fill="url(#grid)"/><ellipse class="breath" cx="1045" cy="215" rx="290" ry="260" fill="url(#light)"/>
<g font-family="Arial,Helvetica,sans-serif"><rect x="55" y="47" width="8" height="8" rx="4" fill="#e8b63a"/><text x="79" y="58" fill="#b1c1b6" font-size="14" letter-spacing="3">MUHAMMAD SHUHAIFE P.</text>
<text x="54" y="140" fill="#eaf0ea" font-size="52" font-weight="700" letter-spacing="-1.8">BUILDING THE SYSTEMS</text><text x="54" y="206" fill="#eaf0ea" font-size="52" font-weight="700" letter-spacing="-1.8">BEHIND <tspan fill="#8cd6b2">BIG IDEAS.</tspan></text>
<text x="57" y="265" fill="#eaf0ea" font-size="23">Senior Software Engineer</text><text x="57" y="303" fill="#b1c1b6" font-size="17">Odoo ERP · Python Backend · SaaS &amp; Cloud Infrastructure</text>
